<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17324d" />
    <meta name="description" content="食事会の料理別候補を、主人公評価とユニットの有効状態から確認できます。" />
    <title>食事会 Perfect候補一覧</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317324d'/%3E%3Cpath d='M16 18v14c0 5 4 9 9 9V55h6V41c5 0 9-4 9-9V18h-5v14c0 2-1 3-3 4V18h-5v18c-2-1-3-2-3-4V18z' fill='%23f0b74b'/%3E%3Cpath d='M45 17c5 2 7 8 7 15v23h-6V39h-4V17z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css?v=20260923-4" />
    <script src="./app.js?v=20260923-4" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">FOOD PARTY PLANNER</p>
        <h1>食事会 Perfect候補一覧</h1>
      </div>
      <p class="header-note">設定はこのブラウザに保存されます</p>
    </header>

    <main class="app-shell">
      <section class="workspace" aria-label="料理別候補">
        <div class="perfect-note">
          <strong>Perfectパターン</strong>
          <ul>
            <li>◯以上を3人</li>
            <li>△を1人、◎を2人</li>
          </ul>
        </div>
        <nav id="weekTabs" class="week-tabs" aria-label="週を選択" role="tablist"></nav>
        <div id="weekPanel" class="meal-grid" role="tabpanel"></div>
      </section>

      <aside class="roster-panel" aria-label="候補ユニット設定">
        <details>
          <summary>
            <span>オプション：候補ユニット設定</span>
            <strong id="activeCount">0 / 0</strong>
          </summary>
          <div class="roster-actions">
            <button type="button" id="enableAll">全員有効</button>
            <button type="button" id="disableAll">全員無効</button>
          </div>
          <div id="roster" class="roster-list"></div>
        </details>
      </aside>
    </main>

    <noscript>このページを使用するにはJavaScriptを有効にしてください。</noscript>
  </body>
</html>
